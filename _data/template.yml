header:
  heading_part1: "<strong>From movement capture to biological insight</strong>"
  #heading_part1: "<strong>Bringing motion analysis within reach for every biologist</strong>"
  #heading_part2: "<strong>Capture movement. Understand behavior. Answer biological questions</strong>"
  #lead_in: "Capture movement. Understand behavior.<br>Answer biological questions"
  lead_in: "Expert guidance on study design, tracking, and kinematic analysis for animal movement research"


challenge:
  intro_summary: "Wild Kinematics helps researchers and organizations design movement studies, capture high-quality motion data, and turn it into meaningful biological insights.<br><br> <strong>Biology comes first: </strong>we help obtaining measurements that are most relevant to your biological question."
  
  # Content inside the black box
  box_title: "Why measure behavior through kinematics?"
  headline: "Subtle maneuvers, escape speeds, or behavioral displays often happen too fast or are too nuanced for standard video or observation. Using high-resolution kinematics allow extracting precise metrics, revealing deeper mechanisms (energy cost, inter-individual differences in behavior or performance...)."
  sub_heading: "Acquiring appropriate, reliable kinematic measurements can feel like a learning a whole new discipline."
  text_1: "You may find yourself in one of these situations:"
  text_2: "<strong>Unsure where to start with hardware:</strong> Choosing camera placements, frame rates, and lighting setups adapted to your biological question."
  text_3: "<strong>Overwhelmed by video tracking tools:</strong> Deciding whether to invest in commercial tracking platforms or use open-source algorithms."
  text_4: "<strong>Stuck with raw footage:</strong> Sitting on hundreds of gigabytes of video without a clear analytical pipeline to extract meaningful variables."
  box_conclusion: "This is where Wild Kinematics can help."

  cta_text: "You bring the biological question<br>Wild Kinematics bridges the technical gap"
  list_title: "How Wild Kinematics can help"
  bullet_1: "<strong>Biology always comes first.</strong> Bringing together biological research experience, experimental design, quantitative analysis, and scientific interpretation to help you obtain measurements that are appropriate, reliable, and most relevant to your biological question."
  bullet_2: "<strong>No guesswork.</strong> Whether you want a guiding partner to train your team and set up a practical pipeline, or a specialist to handle some part of the work for you."
  bullet_3: "<strong>Direct collaboration.</strong> Hands-on support so you don't have to figure it out all alone."
  final_thought: "You bring the biological question; Wild Kinematics bridges the technical gap."

services:
  title: "Services"
  subtitle: "How we can work together."

about:
  heading: "About"
  #subtitle: "Scientific understanding, from both sides of the data."
  name: "Camille Le Roy, PhD"
  tagline: "Researcher, Field Biologist, and Biomechanist"
  intro: "Hi, I'm Camille."
  details_1: "My background is rooted in evolutionary biology. Driven by a passion for understanding how animal movement evolves and diversifies, I specialized in combining ecology and evolution with biomechanics, with a focus on insect flight."
  fun_fact: "<strong>Fun fact:</strong> I originally wanted to become a wildlife filmmaker. I ended up as a researcher, filming animals to decode the evolution of their behavior."
  details_2: "To study the evolution of animal movement, I learned the nuts and bolts of quantifying motion: configuring high-speed camera setups, reconstructing 3D trajectories, and extracting biologically meaningful metrics. My research also involved a lot of fieldwork, whereby I've designed setups to capture motion in fully natural settings."
  details_3: "My career brought me to work closely alongside physicists and aerospace engineers. This gave me deep familiarity with biomechanical tools and engineering principles, and hence a great perspective on how to combine biological and engineering approaches."
  conclusion: "I created Wild Kinematics to bring movement quantification within reach for more researchers, helping break down the barriers between ecology, behavior, and biomechanics."

