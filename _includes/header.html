<style>
    /* Fullscreen Hero Header Layout */
    header.hero-header {
        position: relative;
        width: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        background: linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)),
        /* Adjust the gradient overlay for image background (in agency.css too!!)*/
        url('{{ site.baseurl }}/img/header_image_bg_HD.png') no-repeat center center;
        background-size: cover;
        background-attachment: scroll;
        text-align: left !important;
        padding-top: 50px;
        /* space between navbar and header text */
        padding-bottom: 60px;
    }

    /* Transparent Navbar at Page Top */
    .navbar-default {
        background-color: transparent !important;
        border-color: transparent !important;
        transition: all 0.3s ease-in-out;
    }

    /* Solid Animated Navbar on Scroll (triggered by Agency / cbpAnimatedHeader JS) */
    .navbar-default.navbar-shrink {
        background-color: #222222 !important;
        border-color: transparent !important;
        padding: 10px 0 !important;
    }

    /* Headings & Text Colors for Dark Hero Background */
    .header-part1 {
        display: block;
        font-size: 57px;
        color: #ffffff;
        font-weight: 700;
        margin-bottom: 15px;
        line-height: 1.2;
    }

    .header-part2 {
        display: block;
        font-size: 45px;
        color: #f1f5f9;
        font-weight: 800;
        line-height: 1.2;
        margin-bottom: 20px;
    }

    .header-lead-in-text {
        font-family: 'Montserrat', sans-serif;
        font-size: 28px;
        line-height: 1.5;
        margin-top: 25px;
        margin-bottom: 35px;
        color: #e2e8f0;
        max-width: 900px;
    }

    /* Header Buttons Container & Smooth Hover Effects */
    .header-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 30px;
    }

    .header-buttons .btn-header {
        min-width: 240px;
        border-radius: 50px !important;
        font-weight: 500 !important;
        /* Makes the button text thinner */
        letter-spacing: 0.5px;
        /* Optional: improves readability with thinner text */
        transition: background-color 0.25s ease, border-color 0.25s ease, transform 0.2s ease !important;
    }

    /* 1. Explore Services Button (Light Gold -> Subtly Darker Gold on Hover) */
    .btn-explore {
        background-color: #bda040 !important;
        border-color: #bda040 !important;
        color: #000000 !important;
    }

    .btn-explore:hover,
    .btn-explore:focus {
        background-color: #a88d35 !important;
        border-color: #a88d35 !important;
        color: #000000 !important;
    }

    /* 2. About Button (Dark Green -> Subtly Darker Forest Green on Hover) */
    .btn-about {
        background-color: #35594F !important;
        border-color: #35594F !important;
        color: #ffffff !important;
    }

    .btn-about:hover,
    .btn-about:focus {
        background-color: #27433b !important;
        border-color: #27433b !important;
        color: #ffffff !important;
    }

    /* Mobile Responsive Rules */
    @media (max-width: 768px) {
        header.hero-header {
            min-height: auto;
            padding-top: 120px;
            padding-bottom: 60px;
        }

        .header-part1 {
            font-size: 34px !important;
        }

        .header-part2 {
            font-size: 22px !important;
        }

        .header-lead-in-text {
            font-size: 18px !important;
        }

        .header-buttons {
            flex-direction: column;
            align-items: stretch;
        }

        .header-buttons .btn-header {
            width: 100%;
            min-width: 0;
        }
    }
</style>

<nav class="navbar navbar-default navbar-fixed-top">
    <div class="container">
        <div class="navbar-header page-scroll">
            <button type="button" class="navbar-toggle" data-toggle="collapse"
                data-target="#bs-example-navbar-collapse-1">
                <span class="sr-only">Toggle navigation</span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>

            <!-- Brand Logo / Title -->
            <a class="navbar-brand page-scroll" href="#page-top"
                style="display: flex; flex-direction: column; align-items: flex-start; text-decoration: none; padding-top: 0px; margin-top: 5px; height: auto;">

                <!-- Logo Image -->
                <img src="{{ site.baseurl }}/img/logo_wildkinematics_transparent_white_HD2.png" alt="WildKinematics Logo"
                    style="height: 42px; margin-left: -8px; margin-bottom: 0px;">

                <!-- Styled Brand Text Container -->
                <span
                    style="font-family: 'Montserrat', sans-serif; font-size: 19px; text-transform: uppercase; color: #ffffff; line-height: 1.1;">
                    <!-- SemiBold for WILD -->
                    <span style="font-weight: 600; letter-spacing: 0.5px;">WILD</span>
                    <!-- Light with increased spacing for KINEMATICS -->
                    <span style="font-weight: 300; letter-spacing: 2.5px; margin-left: 2px;">KINEMATICS</span>
                </span>
            </a>
        </div>
        <!-- Navigation Links -->
        <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">
            <ul class="nav navbar-nav navbar-right" style="margin-top: 20px;">
                <li class="hidden"><a href="#page-top"></a></li>
                <li><a href="{{ site.baseurl }}/#services">Services</a></li>
                <li><a href="{{ site.baseurl }}/portfolio">Portfolio</a></li>
                <li><a href="{{ site.baseurl }}/publications">Publications</a></li>
                <li><a href="{{ site.baseurl }}/#about">About</a></li>
            </ul>
        </div>
    </div>
</nav>

<header class="hero-header">
    <div class="container">
        <div class="intro-text">

            <!-- Full-width Heading Row -->
            <div class="row">
                <div class="col-xs-12 col-md-10 col-lg-8">
                    <div class="intro-heading">
                        <span class="header-part1">
                            {{ site.data.template.header.heading_part1 }}
                        </span>
                        <span class="header-part2">
                            {{ site.data.template.header.heading_part2 }}
                        </span>
                    </div>
                </div>
            </div>

            <!-- Lead-in Text -->
            <div class="header-lead-in-text">
                {{ site.data.template.header.lead_in }}
            </div>

            <!-- Action Buttons -->
            <div class="header-buttons">
                <a href="#services" class="page-scroll btn btn-xl btn-header btn-explore">
                    Explore Services
                </a>
                <a href="#about" class="page-scroll btn btn-xl btn-header btn-about">
                    About
                </a>
            </div>

        </div>
    </div>
</header>
