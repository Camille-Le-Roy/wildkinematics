{% assign lang = "en" %}
{% if page.url contains '/fr/' %}
  {% assign lang = "fr" %}
{% endif %}
{% assign t = site.data.template.contact %}

<section id="contact">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading" style="margin-bottom: 50px;">{{ t.heading }}</h2>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-12">
                <div id="success" data-fs-success style="color: #35594F; margin-bottom: 50px;" class="text-center">
                    <h3>{{ t.success_title }}</h3>
                    <p class="large">{{ t.success_msg }}</p>
                </div>

                <div id="error" data-fs-error style="color: #d9534f; font-weight: bold; margin-bottom: 20px;" class="text-center">
                    <p>{{ t.error_msg }}</p>
                </div>

                <form id="contactForm" novalidate>
                    <div class="row contact-row-desktop">
                        
                        <!-- LEFT COLUMN: Contact Details -->
                        <div class="col-md-6 left-inputs-col">
                            <div class="control-group form-group form-field-wrapper">
                                <input type="text" name="name" class="form-control" placeholder="{{ t.name_placeholder }}" id="name" required data-fs-field>
                                <span data-fs-error="name" class="text-danger"></span>
                            </div>
                            <div class="control-group form-group form-field-wrapper">
                                <input type="email" name="email" class="form-control" placeholder="{{ t.email_placeholder }}" id="email" required data-fs-field>
                                <span data-fs-error="email" class="text-danger"></span>
                            </div>
                            <div class="control-group form-group form-field-wrapper">
                                <input type="text" name="referral" class="form-control" placeholder="{{ t.referral_placeholder }}" id="referral" data-fs-field>
                            </div>
                        </div>
                        
                        <!-- RIGHT COLUMN: Service Selection Checkboxes -->
                        <div class="col-md-6 right-services-col">
                            <div class="form-group service-selection-container">
                                <label class="services-label">
                                    {{ t.services_label }}
                                </label>
                                
                                <div class="checkbox-grid">
                                    <label class="checkbox-item">
                                        <input type="checkbox" name="services[]" value="study_plan" id="service-study_plan">
                                        <span>{{ t.options.study_plan }}</span>
                                    </label>

                                    <label class="checkbox-item">
                                        <input type="checkbox" name="services[]" value="motion_setup" id="service-motion_setup">
                                        <span>{{ t.options.motion_setup }}</span>
                                    </label>

                                    <label class="checkbox-item">
                                        <input type="checkbox" name="services[]" value="video_analysis" id="service-video_analysis">
                                        <span>{{ t.options.video_analysis }}</span>
                                    </label>

                                    <label class="checkbox-item">
                                        <input type="checkbox" name="services[]" value="other" id="service-other">
                                        <span>{{ t.options.other }}</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- FULL WIDTH BOTTOM ROW: Message Textarea -->
                        <div class="col-lg-12 col-md-12 message-col">
                            <div class="control-group form-group" style="margin-bottom: 0; width: 100%;">
                                <textarea name="message" class="form-control message-textarea" placeholder="{{ t.message_placeholder }}" id="message" required data-fs-field></textarea>
                                <span data-fs-error="message" class="text-danger"></span>
                            </div>
                        </div>
                        
                        <div class="clearfix"></div>
                        <div class="col-lg-12 text-center submit-btn-wrapper">
                            <button type="submit" class="btn btn-xl" data-fs-submit-btn>{{ t.submit_btn }}</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<!-- Custom Styles for Mobile & Desktop Layouts -->
<style>
    /* Base Desktop Styles */
    .contact-row-desktop {
        display: flex;
        flex-wrap: wrap;
    }

    .left-inputs-col {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .right-services-col {
        display: flex;
        flex-direction: column;
    }

    .form-field-wrapper {
        margin-bottom: 20px;
    }

    .form-field-wrapper input {
        min-height: 80px;
        width: 100%;
    }

    .service-selection-container {
        margin-bottom: 20px;
        background: #f9fbfd;
        padding: 20px 24px;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
    }

    .services-label {
        font-weight: 700;
        margin-bottom: 12px;
        display: block;
        color: #333;
        font-size: 15px;
    }

    .checkbox-grid {
        display: grid;
        grid-template-columns: 1fr;
        column-gap: 15px;
        row-gap: 10px;
        flex: 1;
        align-content: space-evenly;
    }

    .checkbox-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 500;
        color: #4a5568;
        cursor: pointer;
        font-size: 14px;
        margin-bottom: 0;
        padding: 6px 8px;
        border-radius: 4px;
        transition: background-color 0.3s ease;
    }

    .checkbox-item:hover {
        background-color: #edf2f7;
    }

    .checkbox-item input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: #35594F;
        cursor: pointer;
        margin: 0;
        flex-shrink: 0;
    }

    .message-col {
        margin-top: 25px;
    }

    .message-textarea {
        width: 100%;
        min-height: 180px;
        box-sizing: border-box;
        resize: vertical;
    }

    .submit-btn-wrapper {
        margin-top: 45px; /* Increased spacing above button */
    }

    /* Mobile Responsive Optimizations (< 768px) */
    @media (max-width: 767px) {
        .contact-row-desktop {
            display: block;
        }

        .form-field-wrapper {
            margin-bottom: 16px;
        }

        .form-field-wrapper input {
            min-height: 56px;
            font-size: 16px;
        }

        .service-selection-container {
            margin-top: 8px;
            margin-bottom: 16px;
            padding: 16px;
        }

        .checkbox-grid {
            grid-template-columns: 1fr;
            row-gap: 8px;
        }

        .checkbox-item {
            padding: 10px 8px;
            font-size: 15px;
        }

        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
        }

        .message-col {
            margin-top: 16px;
        }

        .message-textarea {
            min-height: 140px;
            font-size: 16px;
        }

        .submit-btn-wrapper {
            margin-top: 35px;
        }

        .submit-btn-wrapper button {
            width: 100%;
            padding: 14px 0;
        }
    }
</style>

<!-- Formspree Scripts -->
<script>
  window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
  formspree('initForm', { 
    formElement: '#contactForm', 
    formId: 'xnjljlnq' 
  });
</script>
<script src="https://unpkg.com/@formspree/ajax@1" defer></script>

<!-- Global Event Delegation Script -->
<script>
(function() {
    function handleServiceCheck(btn) {
        const serviceKey = btn.getAttribute('data-service');
        if (!serviceKey) return;
        
        const targetCheckbox = document.getElementById('service-' + serviceKey);
        if (targetCheckbox) {
            targetCheckbox.checked = true;
            
            // Trigger visual highlight feedback
            const parentLabel = targetCheckbox.closest('.checkbox-item');
            if (parentLabel) {
                parentLabel.style.backgroundColor = '#dbeafe';
                setTimeout(function() {
                    parentLabel.style.backgroundColor = 'transparent';
                }, 1500);
            }
        }
    }

    document.addEventListener('click', function(e) {
        const btn = e.target.closest('.btn-request-horizontal');
        if (btn) {
            handleServiceCheck(btn);
        }
    }, true);
})();
</script>
